name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository_owner == 'SenDeliver' && github.actor == 'SenDeliver'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Tag matches mod_version
        if: github.event_name == 'release'
        run: |
          v=$(sed -n 's/^mod_version=//p' gradle.properties)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != gradle.properties mod_version $v"; exit 1; }
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$v] section"; exit 1; }

      - run: ./gradlew build --no-daemon

      - name: Release notes
        run: |
          f="publishing/release-notes-${GITHUB_REF_NAME#v}.md"
          if [ -f "$f" ]; then cp "$f" release-notes.md
          else awk '/^## \[[0-9]/{if(f)exit;f=1;next} f' CHANGELOG.md > release-notes.md; fi
          cat release-notes.md

      - uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          files: build/libs/!(*-sources|*-javadoc).jar
          name: Octo Arms ${{ github.ref_name }}
          changelog-file: release-notes.md
          version-type: release
          loaders: neoforge
          game-versions: 1.21.1
          java: 21

          modrinth-id: octo-arms
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          modrinth-dependencies: |
            create(required)
            sable(optional)
            jei(optional)

          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-dependencies: |
            create(required)
            sable(optional)
            jei(optional)

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-generate-changelog: false
