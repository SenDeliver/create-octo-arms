plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
    id 'idea'
}

version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id

base {
    archivesName = 'octo-arms'
}

def fmlTestClasses = ['dev.tentaworks.rig.GripFaceTest', 'dev.tentaworks.rig.GripSightTest', 'dev.tentaworks.rig.RigEnchantsTest', 'dev.tentaworks.rig.BacktankTypeTest', 'dev.tentaworks.rig.RigSettingsNbtTest']
def fmlTestReports = layout.buildDirectory.dir('test-results/fmlTest').get().asFile
def fmlTestGameDir = layout.buildDirectory.dir('fmltest-run').get().asFile
configurations {
    fmlTestLibraries
    testImplementation.extendsFrom fmlTestLibraries
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

repositories {
    mavenCentral()
    maven { url = "https://maven.createmod.net" }
    exclusiveContent {
        forRepository { maven { url = "https://maven.tterrag.com" } }
        filter { includeGroup "com.tterrag.registrate" }
    }
    exclusiveContent {
        forRepository { maven { url = "https://maven.blamejared.com" } }
        filter { includeGroup "mezz.jei" }
    }
}

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
        exclude '.cache'
    }
    prodclient {
    }
    dev {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.dev)
        }
        "${mod_id}_fmltest" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.test)
        }
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            project.properties.each { k, v -> if (k.startsWith('tentaworks.')) systemProperty k, v.toString() }
            logLevel = org.slf4j.event.Level.INFO
            loadedMods = [mods."${mod_id}"]
        }
        client {
            client()
            sourceSet = sourceSets.dev
            programArguments.addAll '--width', '1280', '--height', '720'
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
            if (project.hasProperty('connect')) {
                programArguments.addAll '--quickPlayMultiplayer', project.property('connect').toString()
            }
        }
        client2 {
            client()
            sourceSet = sourceSets.dev
            gameDirectory = project.file('run2')
            programArguments.addAll '--width', '1280', '--height', '720', '--username', 'Dev2'
            if (project.hasProperty('tentaworks.script2')) systemProperty 'tentaworks.script', project.property('tentaworks.script2').toString()
            if (project.hasProperty('connect')) {
                programArguments.addAll '--quickPlayMultiplayer', project.property('connect').toString()
            }
        }
        clientProd {
            client()
            sourceSet = sourceSets.prodclient
            loadedMods = []
            gameDirectory = project.file('run-prod/client')
            logLevel = org.slf4j.event.Level.DEBUG
            programArguments.addAll '--width', '1280', '--height', '720', '--username', 'Dev'
            if (project.hasProperty('connect')) {
                programArguments.addAll '--quickPlayMultiplayer', project.property('connect').toString()
            }
        }
        server {
            server()
            sourceSet = sourceSets.dev
            programArgument '--nogui'
            gameDirectory = project.file('run/server')
        }
        fmlTestServer {
            server()
            sourceSet = sourceSets.test
            loadedMods = [mods."${mod_id}_fmltest"]
            gameDirectory = fmlTestGameDir
            programArgument '--nogui'
            systemProperty 'tentaworks.fmltest.reports', fmlTestReports.absolutePath
            systemProperty 'tentaworks.fmltest.classes', fmlTestClasses.join(',')
            additionalRuntimeClasspathConfiguration.extendsFrom(configurations.fmlTestLibraries)
        }
        data {
            data()
            gameDirectory = project.file('run/data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath,
                    '--existing-mod', 'create'
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

obfuscation {
    createRemappingConfiguration(configurations.devRuntimeOnly)
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    modImplementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    modImplementation("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
    modCompileOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
    implementation("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")

    modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    modCompileOnly("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    if (!project.hasProperty('noJei')) modDevRuntimeOnly("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    fmlTestLibraries(platform("org.junit:junit-bom:5.10.1"))
    fmlTestLibraries("org.junit.jupiter:junit-jupiter")
    fmlTestLibraries("org.junit.jupiter:junit-jupiter-engine")
    fmlTestLibraries("org.junit.platform:junit-platform-launcher")
    fmlTestLibraries("org.junit.platform:junit-platform-reporting")
}

def forgeJarName = "forge-${minecraft_version}-${forge_version}.jar"
var unsignedForgeJar = tasks.register('unsignedForgeJar', Zip) {
    description = 'The Minecraft + Forge jar without signature files: on some hosts it keeps Forge\'s signature, which no longer matches the recompiled classes.'
    dependsOn 'createMinecraftArtifacts'
    from(zipTree(layout.buildDirectory.file("moddev/artifacts/${forgeJarName}"))) {
        exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/*.EC'
    }
    archiveFileName = forgeJarName
    destinationDirectory = layout.buildDirectory.dir('moddev/unsigned')
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging.exceptionFormat = 'full'
    def testRunDir = layout.buildDirectory.dir('test-run').get().asFile
    workingDir = testRunDir
    doFirst { testRunDir.mkdirs() }
    classpath = files(unsignedForgeJar) + classpath.filter { !(it.name == forgeJarName && it.parentFile.name == 'artifacts') }
    fmlTestClasses.each { exclude it.replace('.', '/') + '.class' }
    dependsOn 'fmlTest'
}

tasks.named('runFmlTestServer') {
    timeout = java.time.Duration.ofMinutes(5)
    def reports = fmlTestReports
    def gameDir = fmlTestGameDir
    doFirst {
        reports.deleteDir()
        reports.mkdirs()
        gameDir.mkdirs()
        new File(gameDir, 'eula.txt').text = 'eula=true\n'
    }
}

tasks.register('fmlTest') {
    group = 'verification'
    description = 'Runs the JUnit classes that need Forge and Create (fmlTestClasses) in a dev server and checks every test ran and passed.'
    dependsOn 'runFmlTestServer'
    def reports = fmlTestReports
    def expectedClasses = fmlTestClasses
    doLast {
        def summaryFile = new File(reports, 'fmltest.properties')
        if (!summaryFile.exists()) throw new GradleException("No FML test summary in ${reports}: the test server did not run the tests")
        def summary = new Properties()
        summaryFile.withInputStream { summary.load(it) }
        def cases = []
        reports.listFiles().findAll { it.name.endsWith('.xml') }.each { f ->
            cases.addAll(new groovy.xml.XmlSlurper().parse(f).'**'.findAll { it.name() == 'testcase' })
        }
        def bad = cases.findAll { c -> c.children().any { it.name() in ['failure', 'error', 'skipped'] } }
        def missing = expectedClasses.findAll { cls -> !cases.any { it.@classname.text() == cls } }
        def expected = summary.getProperty('expected') as int
        def problems = []
        if (missing) problems << "classes with no test run: ${missing}"
        if (cases.size() != expected) problems << "${cases.size()} test cases in the XML, ${expected} @Test methods"
        if ((summary.getProperty('found') as int) != expected) problems << "JUnit found ${summary.getProperty('found')} tests, ${expected} @Test methods"
        bad.each { problems << "${it.@classname}.${it.@name}: ${it.children()*.name().findAll { it in ['failure', 'error', 'skipped'] }.join(',')}" }
        if (problems) throw new GradleException("FML tests failed (${reports}):\n" + problems.join('\n'))
        println "FML tests: ${cases.size()} passed in ${expectedClasses.size()} classes"
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar) {
    from('LICENSE')
    manifest.attributes(["MixinConfigs": "${mod_id}.mixins.json"])
}

sourceSets {
    devmod {
        compileClasspath += sourceSets.dev.output + sourceSets.dev.compileClasspath
    }
}

legacyForge.addModdingDependenciesTo(sourceSets.prodclient)
legacyForge.addModdingDependenciesTo(sourceSets.test)

tasks.register('devJar', Jar) {
    group = 'build'
    description = 'Test-only jar (dev source set as mod tentaworks_devtools) for prod-pack runs; never shipped.'
    archiveBaseName = 'tentaworks-devtools'
    archiveVersion = mod_version
    destinationDirectory = layout.buildDirectory.dir('devlibs')
    from sourceSets.dev.output
    from sourceSets.devmod.output
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '100000']
}
